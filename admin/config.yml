backend:
  name: git-gateway
  site_domain: dtc-modelshop-capabilities.netlify.app
  branch: main

# Folder where user uploaded media files are saved
media_folder: "public/uploads"
public_folder: "/uploads"

# Display site link in CMS header
site_url: "https://digital-transformation-center.github.io/capabilities-matrix-gh-pages/"

collections:
  - name: "capabilities"
    label: "Capabilities"
    label_singular: "Capability"
    folder: "content/capabilities"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    editor:
      preview: true
    fields:
      - { label: "ID / Slug", name: "id", widget: "string", hint: "Unique identifier (slug) used for referencing in tools" }
      - { label: "Capability Name", name: "title", widget: "string" }
      - { label: "Category / Impact Area", name: "category", widget: "string", required: false, hint: "e.g. Validation, Construction, Prototyping" }
      - label: "Icon"
        name: "icon"
        widget: "select"
        required: false
        default: "material/chip"
        options:
          - { label: "Chip / Microcontroller (material/chip)", value: "material/chip" }
          - { label: "Eye / Inspection (material/eye-outline)", value: "material/eye-outline" }
          - { label: "3D Printer / Fabrication (material/printer-3d)", value: "material/printer-3d" }
          - { label: "Hammer & Wrench / Construction (material/hammer-wrench)", value: "material/hammer-wrench" }
          - { label: "Robot / Automation (material/robot)", value: "material/robot" }
          - { label: "CPU / Electronics (material/cpu-64-bit)", value: "material/cpu-64-bit" }
          - { label: "Cog / Engineering (material/cog-outline)", value: "material/cog-outline" }
          - { label: "Toolbox (material/toolbox-outline)", value: "material/toolbox-outline" }
          - { label: "Scanner / Optical (material/barcode-scan)", value: "material/barcode-scan" }
          - { label: "Camera / Vision (material/camera-outline)", value: "material/camera-outline" }
          - { label: "Gauge / Metrology (material/gauge)", value: "material/gauge" }
          - { label: "Wrench / Maintenance (material/wrench-outline)", value: "material/wrench-outline" }
      - { label: "Color", name: "color", widget: "string", required: false, default: "#3B82F6", hint: "Hex color code (e.g. #3B82F6)" }
      - { label: "Broad Description / Summary", name: "summary", widget: "text", required: false }
      - { label: "Detailed Description (Body)", name: "body", widget: "markdown", required: false }

  - name: "tools"
    label: "Tools"
    label_singular: "Tool"
    folder: "content/tools"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    editor:
      preview: true
    fields:
      - { label: "ID / Slug", name: "id", widget: "string", hint: "Unique identifier (slug) used for referencing in projects" }
      - { label: "Tool Name", name: "title", widget: "string" }
      - { label: "Associated Capability", name: "capability", widget: "relation", collection: "capabilities", search_fields: ["title", "id"], value_field: "id", display_fields: ["title"], required: false }
      - { label: "Category / Type", name: "type", widget: "select", options: ["Physical Tool", "Equipment / Tool", "Hardware", "Software", "Digital System"], default: "Physical Tool", required: false }
      - { label: "Cost / License Tier / Dimensions", name: "dimensions", widget: "string", required: false, hint: "e.g. 600 x 500 x 300 or Tier 1 / Open Source" }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Description / Summary", name: "summary", widget: "text", required: false }
      - { label: "Detailed Description (Body)", name: "body", widget: "markdown", required: false }

  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    editor:
      preview: true
    fields:
      - { label: "ID / Slug", name: "id", widget: "string", hint: "Unique identifier (slug)" }
      - { label: "Project Title", name: "title", widget: "string" }
      - { label: "Status", name: "status", widget: "select", options: ["Concept", "Active", "In Progress", "Completed", "Archived"], default: "Active", required: false }
      - { label: "Project Lead", name: "lead", widget: "string", required: false, default: "DTC Team" }
      - { label: "Associated Tools", name: "tools", widget: "relation", collection: "tools", search_fields: ["title", "id"], value_field: "id", display_fields: ["title"], multiple: true, required: false }
      - { label: "Description / Summary", name: "summary", widget: "text", required: false }
      - { label: "Detailed Description (Body)", name: "body", widget: "markdown", required: false }
